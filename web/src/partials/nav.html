<nav class="nav" data-open="false" aria-label="{{t:nav.principal}}">
  <div class="nav-in">
    <a class="brand" href="{{v:urlInicio}}" aria-label="{{t:marca.aria}}">
      <svg class="logo" viewBox="-6 -4 524 598" aria-hidden="true" focusable="false">{{v:marca}}</svg>
      <b>{{t:marca.nombre}}</b>
    </a>

    <ul class="nav-links" id="menu">
      <li><a href="{{v:urlHerramientas}}" {{v:curHerramientas}}>{{t:nav.herramientas}}</a></li>
      <li><a href="{{v:urlSeguridad}}" {{v:curSeguridad}}>{{t:nav.seguridad}}</a></li>
      <li><a href="{{v:urlDescarga}}" {{v:curDescarga}}>{{t:nav.descarga}}</a></li>
      <li><a href="{{v:urlPreguntas}}" {{v:curPreguntas}}>{{t:nav.preguntas}}</a></li>
      <li><a href="{{v:urlPrivacidad}}" {{v:curPrivacidad}}>{{t:nav.privacidad}}</a></li>
    </ul>

    <div class="nav-acts">
      <button class="icon-btn" type="button" data-tema-boton
              data-etiqueta="{{t:nav.tema}}"
              data-claro="{{t:nav.temaClaro}}" data-oscuro="{{t:nav.temaOscuro}}"
              aria-label="{{t:nav.temaAccion}}" title="{{t:nav.temaAccion}}">
        <!-- Los dos dibujos van pintados, uno encima del otro, y se relevan por
             opacidad: `hidden` —que es `display: none`— los apagaba de golpe y
             el botón del tema era lo único del cambio de tema que no se movía.
             El que manda va con `data-vivo`, y `light` lo trae puesto para que
             antes de que corra el guion se vea el icono correcto y no un hueco. -->
        <svg data-tema-icono="light" data-vivo aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">{{trazo:sol}}</svg>
        <svg data-tema-icono="dark" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">{{trazo:luna}}</svg>
      </button>

      <a class="icon-btn wide" href="{{v:urlIdioma}}" hreflang="{{v:langOtra}}"
         title="{{t:nav.idioma}}" aria-label="{{t:nav.idioma}}"><span lang="{{v:langOtra}}">{{t:nav.idiomaTexto}}</span></a>

      <!-- Ko-fi: el widget oficial del apoyo. Va dentro de .nav-acts porque el
           widget escribe con document.writeln y el botón aparece justo donde
           está este guion; su estilo propio —el azul inclusive— se viste
           después con los colores de la casa, en sitio.css.

           El texto va por el diccionario porque el sitio tiene dos lenguas y el
           widget lo escribe dentro del guion: cada idioma tiene el suyo, y por
           eso la huella que lo autoriza se calcula sobre las páginas servidas y
           no sobre este parcial —lo que se hashea tiene que ser el texto que el
           navegador ejecuta, y el navegador ejecuta el marcador ya resuelto—.
           La dirección del CDN va en la política de contenido (_headers). -->
      <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script>
      <!-- Envuelto, y no por prudencia: el guion del widget llega de un tercero y
           puede no llegar —bloqueado, caído, sin red—. Sin el `try`, esa carga
           fallida deja un `ReferenceError` en la consola por un botón que
           simplemente no sale, y el aviso asusta más que el hecho. -->
      <script type='text/javascript'>try{kofiwidget2.init('{{t:nav.apoyo}}', '#72a4f2', 'F1F6C97RL');kofiwidget2.draw();}catch(e){}</script>

      <!-- El nombre va escrito aunque el texto se vea en el botón: en una pantalla
           estrecha el rótulo se esconde con `display: none` (sitio.css) y de un
           enlace no queda más que el dibujo, que va `aria-hidden`. Sin este
           atributo, en un teléfono el botón de descarga —la acción principal de
           la barra— no se puede anunciar ni invocar por voz. -->
      <a class="btn primary sm" href="{{v:urlDescarga}}" aria-label="{{t:nav.descargar}}">{{ico:descarga}}<span class="lbl">{{t:nav.descargar}}</span></a>

      <button class="icon-btn nav-toggle" type="button" data-menu-boton aria-expanded="false"
              aria-controls="menu" aria-label="{{t:nav.menu}}">{{ico:menu}}</button>
    </div>
  </div>
</nav>
