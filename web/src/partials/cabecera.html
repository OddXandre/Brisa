<!doctype html>
<html lang="{{v:lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{v:titulo}}</title>
<meta name="description" content="{{v:desc}}">
<!-- Lo que se le pide al buscador: indexar, y que pueda enseñar la imagen grande
     y el fragmento entero en el resultado —si no se autoriza, recorta por defecto
     mucho más—. La página de error lo pide al revés: no indexarse, porque lo
     único que dice es que lo que buscabas no está. -->
<meta name="robots" content="{{v:robots}}">
<meta name="application-name" content="{{v:aplicacion}}">
<!-- Cómo se ve esta página cuando alguien la comparte: sin esto, un enlace a
     Brisa aparece como una línea de texto sin cara. Lo que necesita una URL
     completa —la canónica, los idiomas y la tarjeta— lo rellena build.py, y
     mientras no haya dominio se queda vacío en vez de inventarse una dirección. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{v:marcaNombre}}">
<meta property="og:title" content="{{v:titulo}}">
<meta property="og:description" content="{{v:desc}}">
<meta property="og:locale" content="{{v:locale}}">
<meta property="og:locale:alternate" content="{{v:localeOtra}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{v:titulo}}">
<meta name="twitter:description" content="{{v:desc}}">
{{v:compartir}}
{{v:canonical}}
{{v:alternates}}
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F4F8" data-tema-color>
<link rel="icon" type="image/svg+xml" href="{{v:base}}assets/img/icono.svg">
<!-- La primera captura, pedida antes de tiempo. Solo la declaran las páginas que
     tienen una: una precarga de una imagen que no entra en pantalla ocupa el
     ancho de banda que necesita la que sí. -->
{{v:precarga}}
<link rel="stylesheet" href="{{v:base}}assets/css/sitio.css">
<script>
/* El tema se decide antes de pintar el primer píxel. Si se esperase al script del
   pie, la página aparecería en claro y daría un salto al oscuro delante de quien
   la abre. Es lo único que se lee del navegador, y solo lo que guardó el
   conmutador de tema. */
try {
  var tema = localStorage.getItem("brisa.tema");
  if (tema === "light" || tema === "dark") document.documentElement.dataset.theme = tema;
} catch (e) {}
</script>
<!-- Sin guion no hay desplegable, y en un teléfono la barra solo cabe en una
     fila: las cinco puertas de la página viven dentro del menú, así que sin
     JavaScript no se podría salir de la que se está leyendo —el pie las tiene
     todas, pero hay que llegar hasta él—. Este bloque devuelve la lista al
     flujo: la hoja es la misma y solo se deshace lo que la esconde, así que el
     menú queda abierto bajo la barra y el sitio se recorre igual. Solo entra
     cuando el navegador no ejecuta guiones; no es una segunda versión del
     sitio, es su suelo.

     La barra crece lo que crece la lista y empuja el contenido ella sola, así
     que no hay que compensar nada. Lo que sí hay que quitar es el `sticky`: con
     las cinco puertas dentro, la barra pasa de 60 a más de 300 px, y pegada
     arriba taparía media pantalla en cuanto se hiciera scroll. Aquí la
     navegación se queda arriba del documento y se va con él. -->
<noscript><style>
  @media (max-width: 900px) {
    .nav { position: static; }
    /* Sin guion la barra deja de medir lo fijo y crece con la lista, así que el
       contenido no puede seguir subiendo por debajo de ella: se anula el
       adelanto de `main` y cada pieza vuelve a su sitio en el flujo. */
    main { margin-top: 0; padding-top: 0; }
    .nav-in { height: auto; flex-wrap: wrap; row-gap: var(--s-2); padding-bottom: var(--s-3); }
    .nav-links {
      order: 1; position: static; flex-basis: 100%;
      opacity: 1; visibility: visible; transform: none;
      padding: 0; background: none; border-bottom: 0;
    }
    .nav-acts { order: 0; }
    .nav-toggle { display: none; }
  }
</style></noscript>
<!-- La ficha que leen los buscadores: qué es esto, a qué sitio pertenece y —en la
     página de preguntas— sus preguntas con sus respuestas. No se ve, no ejecuta
     nada y va al final para no retrasar lo que sí se ve. -->
{{v:estructurado}}
</head>

<body>
<a class="skip" href="#contenido">{{t:nav.saltar}}</a>
